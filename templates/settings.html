{% extends "repo.html" %}
{% block repo_body %}
{% if error %}<p class="notice error" role="alert">{{ error }}</p>{% endif %}
<section class="panel">
  <h2>Clone URL</h2>
  <div class="clone">
    <input readonly value="{{ clone_url }}" aria-label="Clone URL">
    <button type="button" data-copy="{{ clone_url }}">Copy</button>
  </div>
</section>

<section class="panel">
  <h2>Description</h2>
  <form method="post">
    <input type="hidden" name="action" value="describe">
    <label>Description <input name="description" value="{{ info.description }}" maxlength="500"></label>
    <button type="submit">Save description</button>
  </form>
</section>

{% if branches %}
<section class="panel">
  <h2>Default branch</h2>
  <form method="post">
    <input type="hidden" name="action" value="branch">
    <label>Branch
      <select name="branch">
        {% for b in branches %}<option value="{{ b }}" {% if b == info.branch %}selected{% endif %}>{{ b }}</option>{% endfor %}
      </select>
    </label>
    <button type="submit">Save default branch</button>
  </form>
</section>
{% endif %}

<section class="panel danger">
  <h2>Delete repository</h2>
  <p class="muted">This removes every commit, file and branch of {{ info.name }} from the database. It cannot be undone.</p>
  <form method="post">
    <input type="hidden" name="action" value="delete">
    <label>Type <strong>{{ info.name }}</strong> to confirm <input name="confirm" autocomplete="off"></label>
    <button type="submit" class="danger-button">Delete repository</button>
  </form>
</section>
{% endblock %}
